<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#6366f1" />
<title>Offline • PocketPilot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    padding: 1.5rem;
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: pop 0.5s ease;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .icon-wrap {
    width: 110px; height: 110px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.4rem;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.3); }
    50%      { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(255,255,255,0); }
  }
  .icon-wrap svg { width: 60px; height: 60px; stroke: #fff; }
  h1 { font-size: 1.7rem; margin-bottom: 0.6rem; }
  p { font-size: 0.95rem; opacity: 0.92; line-height: 1.5; margin-bottom: 0.4rem; }
  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-top: 1.2rem;
  }
  .brand { margin-top: 1.4rem; font-weight: 700; font-size: 0.9rem; opacity: 0.9; }
  button {
    margin-top: 1.4rem;
    background: #fff;
    color: #6366f1;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Offline / cloud-slash icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
        <line x1="3" y1="3" x2="21" y2="21" stroke="#fff" stroke-width="2.5"/>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>No internet connection right now.</p>
    <p>Don't worry — you can still access your saved budget data.</p>
    <div class="badge">💾 Your data is safe &amp; local</div>
    <br />
    <button onclick="location.href='./index.html'">Try Again</button>
    <div class="brand">💰 PocketPilot • Smart Budgeting for Students</div>
  </div>
</body>
</html>
